<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Hockey IQ Academy</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div style="max-width:450px; margin:80px auto; background:#111; padding:40px; border-radius:15px; text-align:center;">

<h1 style="color:white;">Hockey IQ Academy</h1>

<h2 style="color:#39d353;">Member Login</h2>

<input
type="email"
placeholder="Email"
style="width:100%; padding:15px; margin:15px 0; border-radius:8px; border:none;">

<input
type="password"
placeholder="Password"
style="width:100%; padding:15px; margin:15px 0; border-radius:8px; border:none;">

<button
style="width:100%; padding:15px; background:#39d353; color:black; border:none; border-radius:8px; font-size:18px; font-weight:bold;">
Log In
</button>

<p style="margin-top:20px; color:white;">
Don't have an account?
<a href="signup.html" style="color:#39d353;">
Sign Up
</a>
</p>
